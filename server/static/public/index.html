<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macca — ローカル音楽ライブラリ</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<header id="topbar">
  <div class="logo">macca<span class="logo-dot">●</span></div>
  <input id="search" type="search" placeholder="曲名・アーティスト・アルバムを検索" autocomplete="off">
  <span id="impl-badge" title="サーバ実装" hidden></span>
  <span id="impl-version" hidden></span>
  <div id="stats" class="stats"></div>
  <button id="rescan" class="ghost-btn" title="ライブラリを再スキャン">再スキャン</button>
</header>

<div id="layout">
  <nav id="sidebar">
    <div class="nav-section">ライブラリ</div>
    <button class="nav-item active" data-view="songs">すべての曲</button>
    <button class="nav-item" data-view="albums">アルバム</button>
    <button class="nav-item" data-view="artists">アーティスト</button>
    <div class="nav-section">フォーマット</div>
    <div id="fmt-filters"></div>
    <div class="nav-section">デバイス</div>
    <div id="devices"><div class="dev-empty">検出中…</div></div>
    <label id="debug-toggle"><input type="checkbox" id="debug-check"> デバッグ</label>
    <div id="debug-panel" hidden></div>
    <div id="debug-tools" hidden>
      <input id="pin-path" type="text" placeholder="フォルダを固定: /Volumes/…" spellcheck="false">
      <button id="pin-browse" class="dev-btn" title="フォルダを開いて選ぶ">📁</button>
      <button id="pin-add" class="dev-btn">固定</button>
    </div>
    <dialog id="browse-dialog">
      <div id="browse-path">デバイスを選択</div>
      <div id="browse-list"></div>
      <div id="browse-actions">
        <button id="browse-up" class="dev-btn">↑ 上へ</button>
        <button id="browse-pin" class="dev-btn">このフォルダを固定</button>
        <button id="browse-close" class="dev-btn">閉じる</button>
      </div>
    </dialog>
  </nav>
  <main id="content"><div class="loading">読み込み中…</div></main>
</div>

<footer id="player" class="hidden">
  <div class="np">
    <img id="np-art" alt="" hidden>
    <div id="np-art-placeholder">♪</div>
    <div class="np-meta">
      <div id="np-title">—</div>
      <div id="np-artist"></div>
    </div>
    <span id="np-badge" class="badge" hidden></span>
  </div>
  <div class="controls">
    <div class="buttons">
      <button id="btn-prev" title="前の曲">⏮</button>
      <button id="btn-play" class="play-btn" title="再生 / 一時停止">▶</button>
      <button id="btn-next" title="次の曲">⏭</button>
      <select id="play-mode" title="再生モード">
        <option value="album">アルバム再生</option>
        <option value="one">1回再生</option>
        <option value="repeat-one">1曲リピート</option>
        <option value="repeat-album">アルバムリピート</option>
        <option value="shuffle-album">アルバムランダム</option>
      </select>
    </div>
    <div class="seek">
      <span id="time-cur">0:00</span>
      <input id="seekbar" type="range" min="0" max="1000" value="0">
      <span id="time-total">0:00</span>
    </div>
  </div>
  <div class="volume">
    <button id="btn-norm" title="音量正規化 (曲間の音量差を揃える)">N</button>
    <span>🔊</span>
    <input id="volbar" type="range" min="0" max="100" value="100">
  </div>
</footer>

<audio id="audio" preload="auto"></audio>
<div id="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
