<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>macca — ローカル音楽ライブラリ</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
</head>
<body>
<header id="topbar">
  <div class="logo">macca<span class="logo-dot">●</span></div>
  <input id="search" type="search" placeholder="曲名・アーティスト・アルバムを検索" autocomplete="off">
  <div id="stats" class="stats"></div>
  <button id="rescan" class="ghost-btn" title="ライブラリを再スキャン">再スキャン</button>
</header>

<div id="layout">
  <nav id="sidebar">
    <div class="nav-section">ライブラリ</div>
    <button class="nav-item active" data-view="songs">すべての曲</button>
    <button class="nav-item" data-view="albums">アルバム</button>
    <button class="nav-item" data-view="artists">アーティスト</button>
    <div class="nav-section">フォーマット</div>
    <div id="fmt-filters"></div>
    <div id="lib-info"></div>
  </nav>
  <main id="content"><div class="loading">読み込み中…</div></main>
</div>

<footer id="player" class="hidden">
  <div class="np">
    <img id="np-art" alt="" hidden>
    <div id="np-art-placeholder">♪</div>
    <div class="np-meta">
      <div id="np-title">—</div>
      <div id="np-artist"></div>
    </div>
    <span id="np-badge" class="badge" hidden></span>
  </div>
  <div class="controls">
    <div class="buttons">
      <button id="btn-shuffle" title="シャッフル">⤨</button>
      <button id="btn-prev" title="前の曲">⏮</button>
      <button id="btn-play" class="play-btn" title="再生 / 一時停止">▶</button>
      <button id="btn-next" title="次の曲">⏭</button>
      <button id="btn-repeat" title="リピート">🔁</button>
    </div>
    <div class="seek">
      <span id="time-cur">0:00</span>
      <input id="seekbar" type="range" min="0" max="1000" value="0">
      <span id="time-total">0:00</span>
    </div>
  </div>
  <div class="volume">
    <span>🔊</span>
    <input id="volbar" type="range" min="0" max="100" value="100">
  </div>
</footer>

<audio id="audio" preload="auto"></audio>
<div id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
